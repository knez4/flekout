<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLEKOUT — mokap: Kako radimo</title>
<!--
  MOKAP, NIJE DEO SAJTA.
  Sekcija 03 "Kako radimo". Kad se ugradi u dist/, ovaj fajl se briše.

  NAČELO: tekst je crn i stoji SVE VREME. Ništa se ne otkriva i ništa ne
  iskače. Skrolom se boji samo konstrukcija — linija, ivica oznake, veza i
  ivica panela prelaze iz sive u plavu. Plava znači "pređeno".

  Posledice, i zato je ovo dobra odluka:
  - nema praznih sivih panela koji liče na skeleton koji se učitava
  - ne ponavlja se brisanje iz sekcije "Zašto Flekout", pa taj potez ostaje
    potpis te sekcije
  - tekst se čita i bez JavaScripta; skripta samo boji konstrukciju

  Tekst koraka je predlog. Korak 04 potvrditi sa klijentom — ne izmišljati
  proceduru da bi se popunio timeline.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2226;
  --body:#4a5257;       /* opis koraka — tamniji od uobičajene prigušene sive */
  --grey:#828b91;
  --paper:#f5f7f8;      /* podloga sekcije — odvaja je od bele "Zašto Flekout" iznad */
  --panel:#fff;
  --track:#cbd3d7;      /* neaktivna konstrukcija */
  --blue:#168ccd;
  --cut-ratio:.3014;    /* nagib nav-a: 22px na 73px = 16.8° */
  --speed:500ms;
  --bw:2px;             /* debljina ivice */
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
  font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ── traka za odlučivanje — NE pripada dizajnu ─────────────────────────── */
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;flex-wrap:wrap;
  gap:10px 26px;align-items:center;padding:12px 20px;background:#11181d;color:#cfdde5;
  font-size:12px;letter-spacing:.02em}
.bar strong{color:#fff;font-weight:600;letter-spacing:.08em;font-size:10px;text-transform:uppercase}
.bar label{display:flex;gap:7px;align-items:center;color:#8ba4b2}
.bar button{font:inherit;background:#1d2a32;color:#cfdde5;border:1px solid #2f414c;
  padding:5px 11px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.bar .spacer{flex:1}

.guide{position:fixed;left:0;right:0;top:66.667vh;z-index:40;pointer-events:none;
  border-top:1px dashed #d43f6a;display:none}
.guide span{position:absolute;right:14px;top:6px;font-size:10px;letter-spacing:.1em;color:#d43f6a}
.show-guide .guide{display:block}

.pad{height:220px;background:#fff;display:grid;place-items:end center;
  color:#b6bdc1;font-size:11px;letter-spacing:.12em;padding-bottom:30px}
.pad.after{height:110vh;background:#17252e;color:#6a8291;place-items:center;padding:0}

/* ── SEKCIJA 03 ───────────────────────────────────────────────────────── */
.process{background:var(--paper);padding:110px 6vw 120px}
.process-inner{max-width:1560px;margin:0 auto}

.eyebrow{display:block;font-size:14px;font-weight:600;letter-spacing:.07em;color:var(--ink)}
.process h2{margin:40px 0 0;font-weight:500;line-height:1.06;letter-spacing:-.05em;max-width:22ch}
.h2-lead{display:block;color:var(--grey);font-size:clamp(24px,2.4vw,34px);
  letter-spacing:-.04em;margin-bottom:.12em}
.h2-punch{display:block;color:var(--ink);font-size:clamp(36px,3.8vw,56px)}

/* ── koraci ───────────────────────────────────────────────────────────── */
.steps{--rail:96px;--line-h:0px;--panel-h:126px;
  position:relative;list-style:none;margin:70px 0 0;padding:0}

/* Siva putanja stoji unapred, plava je preslikava. Ovo je sada bezopasno:
   paneli nisu prazni, pa siva konstrukcija ne liči na skeleton. */
.steps:before,.steps:after{content:"";position:absolute;left:calc(var(--rail) - 1px);
  top:0;width:var(--bw);margin-left:calc(var(--bw) / -2 + 1px)}
.steps:before{bottom:0;background:var(--track)}
.steps:after{height:var(--line-h);background:var(--blue);
  transition:height var(--speed) cubic-bezier(.33,.9,.35,1)}

.step{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);
  gap:clamp(20px,3vw,46px);padding-bottom:clamp(24px,3vw,40px)}
.step:last-child{padding-bottom:0}

/* ── oznaka sa brojem ─────────────────────────────────────────────────────
   Paralelogram u OBRISU, ne ispunjen: spoljni sloj je boja ivice, unutrašnji
   je podloga sekcije uvučena za debljinu ivice. clip-path ne ume da ostavi
   ivicu, pa se obris pravi sa dva sloja. Unutrašnji sloj usput prekida liniju
   koja prolazi iza oznake. */
.step-rail{position:relative}
.step-mark{position:absolute;left:100%;top:calc(var(--panel-h) / 2);
  transform:translate(-50%,-50%);
  --cut:calc(var(--mark-h,38px) * var(--cut-ratio));
  width:var(--mark-w,58px);height:var(--mark-h,38px);
  background:var(--track);transition:background var(--speed) ease;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,var(--cut) 100%)}
.step-mark i{position:absolute;inset:var(--bw);background:var(--paper);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,var(--cut) 100%)}
.step-mark b{position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
/* veza ka panelu */
.step-mark:after{content:"";position:absolute;left:100%;top:50%;
  width:var(--tick,18px);height:var(--bw);margin-top:calc(var(--bw) / -2);
  background:var(--track);transition:background var(--speed) ease}

/* ── panel ────────────────────────────────────────────────────────────────
   Visina je ZADATA, a kosina se izvodi iz nje. Obrnuto pravi petlju koja se
   raspiruje: kosina -> padding -> više redova teksta -> viši panel -> veća
   kosina. U ranijoj verziji je tako odletelo na 120px umesto 43px. */
.step-panel{position:relative;height:var(--panel-h);
  --cut:calc(var(--panel-h) * var(--cut-ratio));
  background:var(--track);transition:background var(--speed) ease;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,var(--cut) 100%)}
.step-panel i{position:absolute;inset:var(--bw);background:var(--panel);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% 100%,var(--cut) 100%)}
.step-body{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;padding:26px calc(var(--cut) + 26px)}

/* kosina samo levo — jeftinija po širini na uskim ekranima */
.is-left .step-panel,.is-left .step-panel i{
  clip-path:polygon(0 0,100% 0,100% 100%,var(--cut) 100%)}
.is-left .step-body{padding:26px 30px 26px calc(var(--cut) + 26px)}
.is-plain .step-panel,.is-plain .step-panel i{clip-path:none}
.is-plain .step-body{padding:26px 30px}

.step-body h3{margin:0;font-size:clamp(20px,1.9vw,27px);font-weight:500;
  letter-spacing:-.03em;color:var(--ink)}
.step-body p{margin:10px 0 0;font-size:16px;line-height:1.65;color:var(--body);
  max-width:46ch}

/* ── pređeno ──────────────────────────────────────────────────────────────
   Menja se SAMO boja ivica. Tekst se ne dira, panel se ne puni, ništa se ne
   pomera. Veza kasni za oznakom, panel za vezom — toliko da se pročita smer,
   a ne toliko da se čeka. */
.step.is-done .step-mark{background:var(--blue)}
.step.is-done .step-mark:after{background:var(--blue);
  transition-delay:calc(var(--speed) * .25)}
.step.is-done .step-panel{background:var(--blue);
  transition-delay:calc(var(--speed) * .45)}

@media(max-width:800px){
  .process{padding:72px 6vw 80px}
  .process h2{margin-top:28px;font-size:clamp(30px,6.6vw,42px)}
  /* Traka i razmaci stegnuti do granice, jer kosina na uskom panelu skupo
     košta: pun paralelogram od 176px visine traži 53px paddinga sa OBE strane. */
  .steps{--rail:36px;--panel-h:176px;margin-top:44px}
  .step{gap:12px;padding-bottom:20px}
  .step-mark{--mark-w:40px;--mark-h:28px;--tick:8px}
  .step-mark b{font-size:11px}
  .step-body{padding:18px calc(var(--cut) + 14px)}
  .is-left .step-body{padding:18px 16px 18px calc(var(--cut) + 14px)}
  .is-plain .step-body{padding:18px 16px}
  .step-body p{font-size:15px;max-width:none}
}

@media(prefers-reduced-motion:reduce){
  .steps:after,.step-mark,.step-mark:after,.step-panel{transition:none}
}
</style>
</head>
<body>

<div class="bar">
  <strong>Mokap</strong>
  <label>Naslov
    <button data-copy="0" aria-pressed="true">1</button>
    <button data-copy="1" aria-pressed="false">2</button>
    <button data-copy="2" aria-pressed="false">3</button>
  </label>
  <label>Panel
    <button data-shape="cut" aria-pressed="true">sečen</button>
    <button data-shape="left" aria-pressed="false">kosa levo</button>
    <button data-shape="plain" aria-pressed="false">pravougaon</button>
  </label>
  <label>Ivica
    <button data-bw="1" aria-pressed="false">1px</button>
    <button data-bw="2" aria-pressed="true">2px</button>
  </label>
  <label>Brzina
    <button data-speed="350" aria-pressed="false">350</button>
    <button data-speed="500" aria-pressed="true">500</button>
    <button data-speed="700" aria-pressed="false">700</button>
  </label>
  <label>Linija okidača
    <button data-guide="0" aria-pressed="true">sakrij</button>
    <button data-guide="1" aria-pressed="false">prikaži</button>
  </label>
  <span class="spacer"></span>
  <button id="replay">Ponovi</button>
</div>

<div class="guide" aria-hidden="true"><span>OKIDAČ — DONJA TREĆINA</span></div>

<div class="pad">↑ IZNAD: 02 / ZAŠTO FLEKOUT (belo)</div>

<section class="process">
  <div class="process-inner">
    <span class="eyebrow">03 / KAKO RADIMO</span>
    <h2><span class="h2-lead"></span><span class="h2-punch"></span></h2>
    <ol class="steps"></ol>
  </div>
</section>

<div class="pad after">SLEDI 04 / FORMA (tamna)</div>

<script>
const COPY = [
  ['Od prvog poziva',                 'do čistog prostora.'],
  ['Četiri koraka.',                  'Ni jedan više.'],
  ['Ne moraš ništa da znaš unapred.', 'Mi vodimo kroz posao.']
];

/* Korak 02 nosi odgovor na cenu — to je i dalje najveće neodgovoreno pitanje
   na sajtu, a ovde se rešava bez objavljivanja cenovnika.
   Korak 04 potvrditi sa klijentom pre objave. */
const STEPS = [
  ['Javiš nam se',      'Kažeš o kakvom prostoru je reč i koje čišćenje ti treba.'],
  ['Izlazak i procena', 'Dolazimo u roku od 48 sati. Izlazak i procena su besplatni.'],
  ['Termin i čišćenje', 'Biraš termin koji ti odgovara. Radimo po dogovorenom obimu.'],
  ['Završni pregled',   'Zajedno prolazimo kroz urađeno i proveravamo dogovoreno.']
];

const list  = document.querySelector('.steps');
const state = { copy: 0, shape: 'cut', bw: 2, speed: 500, guide: 0 };
let pending = new Set(), frame = 0;

function render() {
  document.querySelector('.h2-lead').textContent  = COPY[state.copy][0];
  document.querySelector('.h2-punch').textContent = COPY[state.copy][1];
  document.body.classList.toggle('is-left',  state.shape === 'left');
  document.body.classList.toggle('is-plain', state.shape === 'plain');
  document.body.classList.toggle('show-guide', !!state.guide);
  document.documentElement.style.setProperty('--speed', state.speed + 'ms');
  document.documentElement.style.setProperty('--bw', state.bw + 'px');

  list.style.setProperty('--line-h', '0px');
  list.innerHTML = STEPS.map((_, i) => `
    <li class="step">
      <div class="step-rail"><span class="step-mark"><i></i><b>${String(i + 1).padStart(2, '0')}</b></span></div>
      <div class="step-panel"><i></i><div class="step-body"><h3></h3><p></p></div></div>
    </li>`).join('');

  [...list.children].forEach((li, i) => {
    li.querySelector('h3').textContent = STEPS[i][0];
    li.querySelector('p').textContent  = STEPS[i][1];
  });

  arm();
}

/* Linija staje tačno na oznaci koraka koji je poslednji pređen — jedan izvor
   istine, pa linija i bojenje ne mogu da se raziđu. */
function lineTo(step) {
  const mark = step.querySelector('.step-mark');
  const y = mark.getBoundingClientRect().top + mark.offsetHeight / 2
          - list.getBoundingClientRect().top;
  list.style.setProperty('--line-h', Math.round(y) + 'px');
}

/* Jednosmerno: pređeno ostaje plavo i pri povratku naviše. Korak koji je
   liniju već prešao boji se odmah, bez reda čekanja. */
function pass() {
  frame = 0;
  const line = innerHeight * 2 / 3;
  let last = null;
  pending.forEach(step => {
    if (step.getBoundingClientRect().top > line) return;
    step.classList.add('is-done');
    pending.delete(step);
    last = step;
  });
  if (last) lineTo(last);
  if (!pending.size) removeEventListener('scroll', schedule);
}

function schedule() {
  if (pending.size && !frame) frame = requestAnimationFrame(pass);
}

function arm() {
  pending = new Set(list.querySelectorAll('.step'));
  pass();
  if (pending.size) addEventListener('scroll', schedule, { passive: true });
}

document.querySelector('.bar').addEventListener('click', event => {
  const b = event.target.closest('button');
  if (!b || b.id === 'replay') return;
  const key = ['copy', 'shape', 'bw', 'speed', 'guide'].find(k => b.dataset[k] !== undefined);
  if (!key) return;
  state[key] = (key === 'shape') ? b.dataset[key] : Number(b.dataset[key]);
  [...b.parentElement.querySelectorAll('button')].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});

document.querySelector('#replay').addEventListener('click', () => {
  scrollTo({ top: 0, behavior: 'instant' });
  render();
});

addEventListener('resize', schedule);
document.fonts.ready.then(schedule);
render();
</script>
</body>
</html>
